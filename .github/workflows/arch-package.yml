name: Arch Linux package

# Branch pushes and pull requests build a prerelease package
# (e.g. 0.1.0.r5.gabc1234) that is only kept as a workflow artifact.
#
# Pushing a version tag (v0.2.0) is a release: it builds the package as
# version 0.2.0, creates a GitHub release with the package attached,
# uploads it to repo.geeks.gay and rebuilds the repo database.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REPO_URL: https://repo.geeks.gay
  REPO_ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      package: ${{ steps.makepkg.outputs.package }}
      version: ${{ steps.makepkg.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative kirigami kconfig ki18n kcoreaddons \
            qqc2-desktop-style libwebp hicolor-icon-theme

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pkgver() needs the history and tags

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -nE 's/^project\(token-converter VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "$tag" != "$cmake_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the CMake project version $cmake_version"
            exit 1
          fi

      - name: Build package
        id: makepkg
        run: |
          # makepkg refuses to run as root
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory '*'
          cd packaging/arch
          sudo -u builder makepkg --noconfirm --cleanbuild
          pkg=$(ls -1 *.pkg.tar.zst | head -n1)
          # makepkg writes the computed pkgver back into the PKGBUILD
          version=$(bash -c 'source PKGBUILD && echo "$pkgver-$pkgrel"')
          echo "Built $pkg ($version)"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the installed package
        run: |
          pacman -U --noconfirm "packaging/arch/${{ steps.makepkg.outputs.package }}"
          cd "$(mktemp -d)" # away from the build tree, like a real install
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10 token-converter > app.log 2>&1
          rc=$?
          set -e
          cat app.log
          # 124 = still running when the timeout hit, i.e. the UI loaded
          if [ "$rc" -ne 124 ] || grep -q "failed to load component" app.log; then
            echo "::error::token-converter did not start (exit code $rc)"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'arch-package-release' || 'arch-package-prerelease' }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-package-release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Token Converter ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

      - name: Upload package to repo.geeks.gay
        env:
          REPO_API_TOKEN: ${{ secrets.API_TOKEN }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          test -n "$REPO_API_TOKEN" || { echo "::error::The API_TOKEN repository secret is not set"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$REPO_URL/api/packages?arch=$REPO_ARCH" \
            -H "Authorization: Bearer $REPO_API_TOKEN" \
            -F "file=@$PACKAGE"
          echo

      - name: Rebuild repo database
        env:
          REPO_API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$REPO_URL/api/repo/rebuild" \
            -H "Authorization: Bearer $REPO_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"arch\": \"$REPO_ARCH\"}"
          echo
